[project]
name = "offagent"
version = "0.10.1"
description = "Local-first Office document tooling with a shared CLI and MCP-ready core"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Iwan van der Kleijn" }
]
dependencies = [
  "fastembed>=0.3,<1",
  "mcp>=1,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13,<14",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/soyrochus/office-agent"
Repository = "https://github.com/soyrochus/office-agent"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
office-agent = "offagent.interfaces.cli:main"
offagent = "offagent.interfaces.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.15.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
